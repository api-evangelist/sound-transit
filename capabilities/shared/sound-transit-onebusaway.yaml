naftiko: "1.0.0-alpha1"

info:
  label: "Sound Transit OneBusAway API"
  description: >-
    The Sound Transit OneBusAway API provides real-time and scheduled transit data
    for the Puget Sound region including routes, stops, arrivals, departures, and
    vehicle positions for 1 Line, 2 Line, T Line, and ST Express routes.
  tags:
    - Transit
    - GTFS
    - Real-Time
    - Routes
    - Stops
    - Vehicles
    - Sound Transit
  created: "2026-05-02"
  modified: "2026-05-02"

binds:
  - namespace: env
    keys:
      SOUND_TRANSIT_API_KEY: SOUND_TRANSIT_API_KEY

capability:
  consumes:
    - type: http
      namespace: sound-transit-oba
      baseUri: https://api.pugetsound.onebusaway.org/api/where
      description: "Sound Transit OneBusAway API for real-time transit data"
      resources:
        - name: agencies
          path: /agencies-with-coverage.json
          description: Transit agency coverage information
          operations:
            - name: list-agencies-with-coverage
              method: GET
              description: List all supported transit agencies with geographic coverage areas
              inputParameters:
                - name: key
                  in: query
                  type: string
                  required: true
                  description: API key for authentication
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: agency
          path: /agency/{id}.json
          description: Agency details
          operations:
            - name: get-agency
              method: GET
              description: Get details for a specific transit agency
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: Agency identifier
                - name: key
                  in: query
                  type: string
                  required: true
                  description: API key
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: routes-for-location
          path: /routes-for-location.json
          description: Routes near a location
          operations:
            - name: list-routes-for-location
              method: GET
              description: Search for transit routes near a geographic location
              inputParameters:
                - name: lat
                  in: query
                  type: number
                  required: true
                  description: Latitude
                - name: lon
                  in: query
                  type: number
                  required: true
                  description: Longitude
                - name: radius
                  in: query
                  type: integer
                  required: false
                  description: Search radius in meters
                - name: key
                  in: query
                  type: string
                  required: true
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: stops-for-location
          path: /stops-for-location.json
          description: Stops near a location
          operations:
            - name: list-stops-for-location
              method: GET
              description: Find transit stops near a geographic location
              inputParameters:
                - name: lat
                  in: query
                  type: number
                  required: true
                  description: Latitude
                - name: lon
                  in: query
                  type: number
                  required: true
                  description: Longitude
                - name: radius
                  in: query
                  type: integer
                  required: false
                  description: Search radius in meters
                - name: key
                  in: query
                  type: string
                  required: true
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: arrivals-and-departures
          path: /arrivals-and-departures-for-stop/{id}.json
          description: Real-time arrivals and departures for a stop
          operations:
            - name: get-arrivals-and-departures-for-stop
              method: GET
              description: Get current real-time arrivals and departures for a transit stop
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: Stop identifier
                - name: minutesBefore
                  in: query
                  type: integer
                  required: false
                  description: Minutes before now to include
                - name: minutesAfter
                  in: query
                  type: integer
                  required: false
                  description: Minutes after now to include
                - name: key
                  in: query
                  type: string
                  required: true
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: trips-for-route
          path: /trips-for-route/{id}.json
          description: Active trips for a route
          operations:
            - name: list-trips-for-route
              method: GET
              description: Get all currently active trips for a specific route
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: Route identifier
                - name: includeStatus
                  in: query
                  type: boolean
                  required: false
                  description: Include real-time status information
                - name: key
                  in: query
                  type: string
                  required: true
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: vehicles-for-agency
          path: /vehicles-for-agency/{id}.json
          description: Active vehicles for an agency
          operations:
            - name: list-vehicles-for-agency
              method: GET
              description: Get all currently active vehicles for a transit agency
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: Agency identifier
                - name: key
                  in: query
                  type: string
                  required: true
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: schedule-for-stop
          path: /schedule-for-stop/{id}.json
          description: Full schedule for a stop
          operations:
            - name: get-schedule-for-stop
              method: GET
              description: Get the full schedule for a stop on a particular day
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: Stop identifier
                - name: date
                  in: query
                  type: string
                  required: false
                  description: Service date (YYYY-MM-DD)
                - name: key
                  in: query
                  type: string
                  required: true
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: sound-transit-oba-rest
      resources:
        - path: /v1/agencies
          name: agencies
          description: Transit agency information
          operations:
            - method: GET
              name: list-agencies
              description: List agencies with coverage

        - path: /v1/stops
          name: stops
          description: Stop discovery
          operations:
            - method: GET
              name: list-stops-for-location
              description: Find stops near a location

        - path: /v1/arrivals
          name: arrivals
          description: Real-time arrivals
          operations:
            - method: GET
              name: get-arrivals
              description: Get arrivals for a stop

    - type: mcp
      port: 9100
      namespace: sound-transit-oba-mcp
      transport: http
      tools:
        - name: find-stops-near-location
          description: Find transit stops near a geographic location
          hints:
            readOnly: true
            openWorld: true
          call: "sound-transit-oba.list-stops-for-location"
          with:
            lat: "tools.lat"
            lon: "tools.lon"
            radius: "tools.radius"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-stop-arrivals
          description: Get real-time arrivals and departures for a transit stop
          hints:
            readOnly: true
            openWorld: true
          call: "sound-transit-oba.get-arrivals-and-departures-for-stop"
          with:
            id: "tools.stop_id"
            minutesAfter: "tools.minutes_after"
          outputParameters:
            - type: object
              mapping: "$."

        - name: list-active-vehicles
          description: Get all currently active vehicles for a transit agency
          hints:
            readOnly: true
            openWorld: true
          call: "sound-transit-oba.list-vehicles-for-agency"
          with:
            id: "tools.agency_id"
          outputParameters:
            - type: object
              mapping: "$."
