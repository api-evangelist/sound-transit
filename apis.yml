aid: sound-transit
name: Sound Transit
description: >-
  Sound Transit is a regional transit authority serving the Seattle-Puget Sound area of Washington State, operating
  light rail, commuter rail, and express bus services. The Sound Transit Open Transit Data (OTD) program provides GTFS
  static and real-time data feeds, OneBusAway API access, and GTFS-RT service alerts for transit application developers
  and researchers.
